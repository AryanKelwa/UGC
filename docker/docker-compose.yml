version: '3.8'

# ============================================================
# UGC Pipeline Infrastructure
# Includes: Zookeeper, Kafka, Kafka UI, and the original LLM
#           fine-tuning container.
# ============================================================

networks:
  ugc-net:
    driver: bridge

services:

  # ── Apache Zookeeper (required by Kafka) ─────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: ugc_zookeeper
    networks:
      - ugc-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Kafka Broker ───────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ugc_kafka
    networks:
      - ugc-net
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"       # internal (container → container)
      - "29092:29092"     # external (host → broker)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168        # 7 days
      KAFKA_LOG_RETENTION_BYTES: -1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Kafka UI (optional — browse topics in browser) ────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ugc_kafka_ui
    networks:
      - ugc-net
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ugc-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # ── Kafka Topic Init (create topics on first run) ─────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ugc_kafka_init
    networks:
      - ugc-net
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic ugc.raw.batches --partitions 3 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic ugc.processed.conversations --partitions 3 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic ugc.dead_letter --partitions 1 --replication-factor 1

      echo 'Kafka topics created successfully.'
      "
    restart: on-failure

  # ── LLM Fine-Tuning Pipeline ──────────────────────────────
  llm-finetuning:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: llm_finetuning_pipeline
    networks:
      - ugc-net
    depends_on:
      kafka:
        condition: service_healthy
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # Kafka bootstrap points to the broker container name inside the network
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    env_file:
      - ../.env
    volumes:
      - ..:/workspace
    command: python3 main.py run-all
