[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-finetuning"
version = "1.0.0"
description = "Enterprise pipeline for real estate lead qualification LLM fine-tuning."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "requests",
    "python-dotenv",
    "spacy",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
