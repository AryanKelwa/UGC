version: 0.2
# buildspec.yml
# =============
# Builds the LLM fine-tuning Docker image and pushes to ECR.
#
# CACHING STRATEGY — reduces build time from ~15 min to ~2-3 min:
#   1. Pull the previous :latest image from ECR before building.
#   2. Pass it as --cache-from so unchanged layers are reused from ECR.
#   3. The base CUDA image layer and all pip install layers are cached.
#   4. Only the final COPY source-code layer rebuilds each time.
#
# Tags pushed:
#   :latest     — always the most recent build
#   :YYYYMMDD   — date-stamped for traceability and rollback

env:
  variables:
    ECR_REPO_NAME: "llm-finetuning"

phases:
  pre_build:
    commands:
      - echo "=== Logging in to Amazon ECR ==="
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo "=== Ensuring ECR repository exists ==="
      - aws ecr create-repository --repository-name $ECR_REPO_NAME --region $AWS_DEFAULT_REGION || true
      - export ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME
      - export BUILD_TAG=$(date +%Y%m%d)
      - echo "ECR URI    $ECR_URI"
      - echo "Build Tag  $BUILD_TAG"
      # Pull previous :latest image to use as Docker layer cache.
      # Fails silently on the very first build when no image exists yet.
      - echo "=== Pulling previous image for layer cache ==="
      - docker pull $ECR_URI:latest || true

  build:
    commands:
      - echo "=== Building Docker image with layer cache ==="
      - docker build --cache-from $ECR_URI:latest --build-arg BUILDKIT_INLINE_CACHE=1 -t $ECR_REPO_NAME:latest -t $ECR_REPO_NAME:$BUILD_TAG -f docker/Dockerfile .
      - echo "=== Tagging for ECR ==="
      - docker tag "$ECR_REPO_NAME:latest" "$ECR_URI:latest"
      - docker tag "$ECR_REPO_NAME:$BUILD_TAG" "$ECR_URI:$BUILD_TAG"

  post_build:
    commands:
      - echo "=== Pushing image to ECR ==="
      - docker push $ECR_URI:latest
      - docker push $ECR_URI:$BUILD_TAG
      - echo "=== Done. Pushed $ECR_URI:latest and $ECR_URI:$BUILD_TAG ==="
