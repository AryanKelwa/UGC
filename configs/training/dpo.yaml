# configs/training/dpo.yaml
training:
  type: "dpo"
  beta: 0.1
  loss_type: "sigmoid"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-7
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  logging_steps: 5
  evaluation_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  bf16: true
  fp16: false
  report_to: "wandb"
