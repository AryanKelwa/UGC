# configs/training/sft.yaml
training:
  type: "sft"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 10
  evaluation_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  bf16: true
  fp16: false
  optim: "adamw_torch"
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  report_to: "wandb"
