# configs/model/llama3_8b.yaml
model:
  name_or_path: "unsloth/Meta-Llama-3.1-8B-bnb-4bit"
  max_seq_length: 2048
  load_in_4bit: true
  dtype: null  # auto-detect
  # Standard HF fallback
  hf_fallback: "meta-llama/Meta-Llama-3-8B-Instruct"
  torch_dtype: "bfloat16"
  use_cache: false
  trust_remote_code: true
  # Flash Attention 2 is used for inference (HF DLC on g4dn supports it via TGI)
  # but DISABLED for training on ml.g4dn.xlarge (T4 GPU — no FA2 support).
  # The SageMaker Training Job sets DISABLE_FLASH_ATTN=true which switches this to "eager".
  attn_implementation: "flash_attention_2"  # overridden to "eager" during training
